
name: Final repair
on: [push]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("worker.js")
          s=p.read_text()
          s=s.replace("if(!env.APP_SECRET||request.headers.get('x-app-key')!==env.APP_SECRET)return new Response('Unauthorized',{status:401});","")
          s=s.replace("@cf/meta/llama-3.3-70b-instruct-fp8-fast","@cf/meta/llama-4-scout-17b-16e-instruct")
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add worker.js
          git commit -m "Final repair" || true
          git push
