name: Fix AI model

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-model.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update AI model
        run: |
          sed -i 's|@cf/meta/llama-3.1-8b-instruct|@cf/meta/llama-3.3-70b-instruct-fp8-fast|g' worker.js
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add worker.js
          git commit -m "Fix AI chat model"
          git push
