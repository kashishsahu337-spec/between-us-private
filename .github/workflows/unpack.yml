name: Unpack app

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unpack.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract app
        run: |
          unzip -o between-us-simple-3-files.zip
          rm between-us-simple-3-files.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Install Between Us app"
          git push
